<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRMS - Reset Password</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .reset-box {
            width: min(90%, 420px);
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        label,
        input,
        button {
            display: block;
            width: 100%;
        }

        label {
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input,
        button {
            padding: 13px;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            margin-top: 20px;
            border: 0;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }

        a {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #2563eb;
        }
    </style>
</head>
<body>
    <main class="reset-box">
        <h1>Reset password</h1>
        <form id="resetForm">
            <label for="password">New password</label>
            <input id="password" type="password" minlength="6" required>
            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" type="password" minlength="6" required>
            <button type="submit">Update password</button>
        </form>
        <div id="message" aria-live="polite"></div>
        <a href="Admin.html">Return to sign in</a>
    </main>

    <script>
        document.getElementById("resetForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const message = document.getElementById("message");

            if (password !== confirmPassword) {
                message.textContent = "The passwords do not match.";
                return;
            }

            message.textContent = "Updating password...";
            const { error } = await supabaseClient.auth.updateUser({ password });

            if (error) {
                message.textContent = `Could not update password: ${error.message}`;
                return;
            }

            message.textContent = "Password updated. You can now sign in.";
            document.getElementById("resetForm").reset();
        });
    </script>
</body>
</html>
