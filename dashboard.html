<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DRMS - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
        }

        header h1 {
            font-size: 24px;
        }

        header p {
            margin-top: 5px;
            opacity: 0.9;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.07);
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .card p {
            color: #666;
            margin-bottom: 20px;
        }

        button {
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .logout {
            margin-top: 30px;
            background: #dc2626;
        }

        .logout:hover {
            background: #b91c1c;
        }

        .upload-status,
        .uploads-list {
            margin-top: 15px;
        }

        .upload-status {
            min-height: 20px;
            color: #374151;
        }

        .uploads-list {
            list-style: none;
        }

        .uploads-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .uploads-list a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .uploads-list a:hover {
            text-decoration: underline;
        }

        .uploads-empty {
            color: #666;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        @media (max-width: 500px) {
            .uploads-list li {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>DRMS</h1>
        <p>Digital Results Management System</p>
    </header>

    <div class="container">

        <div class="welcome">
            <h2>Administrator Dashboard</h2>
            <p>Welcome, Owner</p>
        </div>

        <div class="cards">

            <div class="card">
                <h2>📤 Upload Results</h2>

                <p>
                    Upload learner results using Excel or PDF.
                </p>

                <button onclick="uploadResults()">
                    Upload Results
                </button>

                <input
                    id="resultsFile"
                    type="file"
                    accept=".xlsx,.xls,.pdf,application/pdf,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                    hidden
                    onchange="handleResultsFile(this)"
                >

                <div id="uploadStatus" class="upload-status" aria-live="polite"></div>
            </div>


            <div class="card">
                <h2>📁 Uploaded Results</h2>

                <p>
                    View files that have been uploaded.
                </p>

                <button onclick="viewUploads()">
                    View Uploads
                </button>

                <ul id="uploadsList" class="uploads-list"></ul>
            </div>


            <div class="card">
                <h2>🏫 Schools</h2>

                <p>
                    Manage schools and administrators.
                </p>

                <button onclick="manageSchools()">
                    Manage Schools
                </button>
            </div>

        </div>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>


   <script>

    async function checkLogin() {

        const {
            data: { session }
        } = await supabaseClient.auth.getSession();

        if (!session) {
            window.location.href = "admin.html";
            return;
        }

        const { data: profile } =
            await supabaseClient
                .from("admin_profiles")
                .select("full_name, role")
                .eq("id", session.user.id)
                .single();

        if (profile) {
            document.querySelector(".welcome p").textContent =
                "Welcome, " + (profile.full_name || "Administrator");
        }

        await viewUploads();
    }


    async function logout() {

        await supabaseClient.auth.signOut();

        window.location.href = "admin.html";
    }


    function uploadResults() {
        document.getElementById("resultsFile").click();
    }


    async function handleResultsFile(input) {
        const file = input.files[0];
        const status = document.getElementById("uploadStatus");
        const uploadButton = input.previousElementSibling;

        if (!file) {
            return;
        }

        const allowedExtensions = ["xlsx", "xls", "pdf"];
        const extension = file.name.split(".").pop().toLowerCase();

        if (!allowedExtensions.includes(extension)) {
            status.textContent = "Please choose an Excel or PDF file.";
            input.value = "";
            return;
        }

        if (file.size > 10 * 1024 * 1024) {
            status.textContent = "The file must be smaller than 10 MB.";
            input.value = "";
            return;
        }

        const {
            data: { session }
        } = await supabaseClient.auth.getSession();

        if (!session) {
            window.location.href = "admin.html";
            return;
        }

        uploadButton.disabled = true;
        status.textContent = "Uploading...";

        const safeFileName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        const filePath = `${session.user.id}/${Date.now()}-${crypto.randomUUID()}-${safeFileName}`;

        const { error: uploadError } = await supabaseClient
            .storage
            .from("results")
            .upload(filePath, file, {
                cacheControl: "3600",
                upsert: false,
                contentType: file.type || "application/octet-stream"
            });

        if (uploadError) {
            status.textContent = `Upload failed: ${uploadError.message}`;
            uploadButton.disabled = false;
            input.value = "";
            return;
        }

        const { error: recordError } = await supabaseClient
            .from("result_uploads")
            .insert({
                file_name: file.name,
                storage_path: filePath,
                file_type: file.type,
                uploaded_by: session.user.id
            });

        if (recordError) {
            await supabaseClient.storage.from("results").remove([filePath]);
            status.textContent = `Upload details could not be saved: ${recordError.message}`;
            uploadButton.disabled = false;
            input.value = "";
            return;
        }

        status.textContent = "Results uploaded successfully.";
        uploadButton.disabled = false;
        input.value = "";
        await viewUploads();
    }


    async function viewUploads() {
        const list = document.getElementById("uploadsList");
        list.innerHTML = "<li>Loading uploads...</li>";

        const {
            data: { session }
        } = await supabaseClient.auth.getSession();

        if (!session) {
            window.location.href = "admin.html";
            return;
        }

        const { data: uploads, error } = await supabaseClient
            .from("result_uploads")
            .select("id, file_name, storage_path, uploaded_at")
            .eq("uploaded_by", session.user.id)
            .order("uploaded_at", { ascending: false });

        if (error) {
            list.innerHTML = `<li class="uploads-empty">Could not load uploads: ${error.message}</li>`;
            return;
        }

        list.innerHTML = "";

        if (!uploads.length) {
            list.innerHTML = "<li class=\"uploads-empty\">No uploaded results yet.</li>";
            return;
        }

        for (const upload of uploads) {
            const { data: signedUrl, error: urlError } = await supabaseClient
                .storage
                .from("results")
                .createSignedUrl(upload.storage_path, 3600);

            const item = document.createElement("li");
            const name = document.createElement("span");
            name.textContent = upload.file_name;
            item.appendChild(name);

            if (!urlError) {
                const link = document.createElement("a");
                link.href = signedUrl.signedUrl;
                link.target = "_blank";
                link.rel = "noopener";
                link.textContent = "Download";
                item.appendChild(link);
            }

            list.appendChild(item);
        }
    }


    function manageSchools() {
        alert("School management section coming next.");
    }


    checkLogin();

</script>

</body>
</html>
